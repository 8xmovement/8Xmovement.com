<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8X</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap');

        /* Base Variables & Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at center 70%, #2a2a2a 0%, #050505 100%);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            padding-bottom: 90px; /* Space for sticky footer button */
        }

        /* Top Bar: Pill and Clock */
        .top-bar {
            padding: 20px 30px;
            display: flex;
            justify-content: flex-start;
            width: 100%;
        }

        .status-pill {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 40px;
            padding: 6px 20px 6px 6px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .status-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            margin-right: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .status-logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .status-text {
            display: flex;
            gap: 25px;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        /* Members Row (Circular Avatars) */
        .members-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            padding: 10px 20px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .member {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #fff;
            transition: transform 0.2s ease, opacity 0.2s ease;
            cursor: pointer;
        }

        .member:hover {
            transform: translateY(-4px);
        }

        .member:active {
            transform: scale(0.95);
        }

        .member-avatar {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: linear-gradient(135deg, #555, #111);
            border: 2px solid rgba(255,255,255,0.8);
            margin-bottom: 8px;
            object-fit: cover;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }

        .member-name {
            font-size: 0.85rem;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* Clean Divider */
        .divider {
            width: 85%;
            max-width: 900px;
            height: 2px;
            margin: 20px auto 35px auto;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        }

        /* Projects/Tracks Container */
        .projects-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 0 20px;
            flex-wrap: wrap;
        }

        /* Info Panel for Home Screen */
        .info-panel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 24px;
            max-width: 380px;
            width: 100%;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #ddd;
            font-size: 0.95rem;
            line-height: 1.5;
            letter-spacing: 1px;
            text-align: left;
            animation: fadeIn 0.4s ease-in-out;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .info-logo-img {
            max-width: 130px;
            height: auto;
            margin-bottom: 15px;
            object-fit: contain;
        }

        .info-panel p {
            margin-bottom: 10px;
        }

        .project-card-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .project-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
        }

        .project-card {
            width: 125px;
            height: 125px;
            background: #000;
            border-radius: 12px; 
            border: 2px solid #fff;
            border-bottom: 5px solid #fff; 
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: block; 
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .project-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 25px rgba(255, 255, 255, 0.15);
        }

        .project-card:active {
            transform: scale(0.96);
        }

        .project-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .project-code {
            font-family: monospace;
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: #888;
        }

        /* Floating Footer Controls */
        .footer-controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.2s ease;
            z-index: 100;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .footer-controls:hover {
            transform: scale(1.04);
            background: rgba(0, 0, 0, 0.85);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .footer-controls:active {
            transform: scale(0.95);
        }

        .btn-prompt {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-style: italic;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .x-button {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #222;
            border: 1px solid #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: bold;
            color: #fff;
        }

        /* Responsive Mobile Styles */
        @media (max-width: 600px) {
            .top-bar {
                padding: 15px;
            }

            .status-pill {
                padding: 4px 15px 4px 4px;
            }

            .status-text {
                gap: 15px;
                font-size: 0.8rem;
            }

            .members-container {
                gap: 15px;
                padding: 5px 10px;
            }

            .member-avatar {
                width: 60px;
                height: 60px;
            }

            .member-name {
                font-size: 0.75rem;
            }

            .divider {
                margin: 15px auto 25px auto;
            }

            .projects-container {
                gap: 25px;
            }

            .info-panel {
                padding: 18px;
                font-size: 0.88rem;
            }

            .project-card {
                width: 110px;
                height: 110px;
            }
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="status-pill">
            <div class="status-icon">
                <img src="8XLOGOWHITE.png" class="status-logo-img" alt="8X Logo">
            </div>
            <div class="status-text">
                <span id="current-view">Home</span>
                <span id="clock">00:00AM</span>
            </div>
        </div>
    </div>

    <!-- MEMBERS -->
    <div class="members-container">
        <div class="member" onclick="loadReleases('truleeko', 'truleeko')">
            <img src="https://images.genius.com/334f649ad315bdf4c62ec3bebf0a6b02.800x800x1.jpg" class="member-avatar" alt="Leek">
            <span class="member-name">truleeko</span>
        </div>
        <div class="member" onclick="loadReleases('si6yon', 'si6yon')">
            <img src="https://i.ytimg.com/vi/A7bDj5vKV70/hqdefault.jpg?sqp=-oaymwEcCPYBEIoBSFXyq4qpAw4IARUAAIhCGAFwAcABBg==&rs=AOn4CLD-deCDXmYtpYmruIO1292ON9sTAA" class="member-avatar" alt="Saz">
            <span class="member-name">si6yon</span>
        </div>
        <div class="member" onclick="loadReleases('1kaj', '1kaj')">
            <img src="https://images.genius.com/7571e316430b5283756441cfb005a83b.885x885x1.jpg" class="member-avatar" alt="Kaj">
            <span class="member-name">1kaj</span>
        </div>
        <div class="member" onclick="loadReleases('reilocore', 'reilocore')">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTNTbOIvzeCPRR7uJ-msZq4D--v0mAFooCRoaZ7nsWDLJdVjktLZNVupRM&s=10" class="member-avatar" alt="Reilo">
            <span class="member-name">reilocore</span>
        </div>
    </div>

    <!-- DIVIDER -->
    <div class="divider"></div>

    <!-- PROJECTS / RELEASES -->
    <div class="projects-container" id="projects-container">
        <!-- Content injected dynamically via JS -->
    </div>

    <!-- FOOTER CONTROLS -->
    <div class="footer-controls" onclick="loadReleases('home', 'Home')">
        <span class="btn-prompt">back</span>
        <div class="x-button">X</div>
    </div>

    <!-- SCRIPTS -->
    <script>
        // --- 1. Clock Functionality ---
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes;
            
            const timeString = hours + ':' + minutes + ampm;
            document.getElementById('clock').textContent = timeString;
        }
        setInterval(updateClock, 1000);
        updateClock(); 

        // --- 2. Dynamic Content Loading ---
        const releasesData = {
            home: [
                { title: "8X MOVEMENT", image: "https://img.magnific.com/premium-vector/soundcloud-logo_578229-231.jpg?semt=ais_hybrid&w=740&q=80", code: "HOME-001", link: "https://soundcloud.com/8xmovement" }
            ],
            truleeko: [
                { title: "Z2", image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTB3Oo5H1DBYsRr_qbeZ5B-_5mXAF_2O4hIJAGtR8N9bA&s", code: "TRU-001", link: "https://soundcloud.com/truleeko/sets/zz2" },
                { title: "Z", image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTLRgfQfu0TK1GT1oq_KFcb8k1JYVp0TGHjUsqFkPMat2nW63pPn2mKsq4&s=10", code: "TRU-002", link: "https://soundcloud.com/truleekoarc/sets/zzz" }
            ],
            si6yon: [
                { title: "LONG LIVE AMERICA", image: "https://i1.sndcdn.com/artworks-6l13P0TjBGO7gc5P-9wb7Zg-t500x500.jpg", code: "SI6-001", link: "https://soundcloud.com/si6yon/sets/long-live-america" },
                { title: "MY WORLD IS EVIL", image: "https://i1.sndcdn.com/artworks-KLG0bbQMXjSsbyza-afoLuQ-t1080x1080.jpg", code: "SI6-002", link: "https://soundcloud.com/si6yon/sets/my-world-is-evil" }
            ],
            '1kaj': [
                { title: "danger", image: "https://m.media-amazon.com/images/I/41EjhRT2DHL._UX358_FMwebp_QL85_.jpg", code: "KAJ-002", link: "https://soundcloud.com/1kaj/sets/danger" },
            ],
            reilocore: [
                { title: "Amphetamine", image: "https://i1.sndcdn.com/artworks-APv7SdAU5S1mjv5b-73ZEXQ-t1080x1080.jpg", code: "REI-001", link: "https://soundcloud.com/reilocore/sets/amphetamine" }
            ]
        };

        function loadReleases(artistKey, displayName) {
            const container = document.getElementById('projects-container');
            const currentViewLabel = document.getElementById('current-view');
            
            currentViewLabel.textContent = displayName;
            container.innerHTML = '';

            if (artistKey === 'home') {
                const infoPanel = document.createElement('div');
                infoPanel.className = 'info-panel';
                infoPanel.innerHTML = `
                    <img src="8XLOGOWHITE.png" class="info-logo-img" alt="8X Logo">
                    <p>8X is a versatile hip hop music collective founded by truleeko, 1kaj, rnnr9, reilocore, si6yon, and maruzen.</p>
                    <p style="color: #888; font-family: monospace; margin-top: 10px;">> CONNECTED_VIA_WEB <br>> EST. IN THE ETHER</p>
                `;
                container.appendChild(infoPanel);
            }

            const data = releasesData[artistKey] || releasesData['home'];

            data.forEach(item => {
                const wrapper = document.createElement('div');
                wrapper.className = 'project-card-wrapper';
                
                wrapper.innerHTML = `
                    <div class="project-title">${item.title}</div>
                    <a href="${item.link}" class="project-card" target="_blank" rel="noopener noreferrer">
                        <img src="${item.image}" class="project-image" alt="Cover">
                    </a>
                    <div class="project-code">${item.code}</div>
                `;
                
                container.appendChild(wrapper);
            });
        }

        window.onload = function() {
            loadReleases('home', 'Home');
        };
    </script>

</body>
</html>
